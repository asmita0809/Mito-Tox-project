[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mitotox"
version = "1.0.0"
description = "QSAR classifier for mitochondrial membrane potential disruption, trained on Tox21 AID 720637"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Asmita Saha" }]
keywords = ["QSAR", "cheminformatics", "toxicology", "Tox21", "mitochondria", "RDKit"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "rdkit>=2023.9",
    "matplotlib>=3.7",
    "joblib>=1.3",
    "requests>=2.28",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"
